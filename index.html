<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Interactive multilingual SOP learning hub for merchant-facing workflows."
    >
    <meta name="theme-color" content="#ff3008">
    <title>SOP Learning Hub</title>

    <link rel="icon" href="assets/images/sop-mark.svg" type="image/svg+xml">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="assets/css/styles.css">

    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/sop-content.js" defer></script>
    <script type="module" src="assets/js/app.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#app-main">Skip to content</a>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
        <button class="brand" type="button" data-route="home" aria-label="Open home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img">
              <path d="M7 15.5h19.5c7.4 0 13.5 6 13.5 13.5S33.9 42.5 26.5 42.5H17l8-8H7l10-9H7z"></path>
            </svg>
          </span>

          <span class="brand-copy">
            <strong>SOP</strong>
            <small>Learning Hub</small>
          </span>
        </button>

        <nav class="side-nav" id="side-nav">
          <button class="nav-link is-active" type="button" data-route="home" data-i18n="navHome"></button>
          <button class="nav-link" type="button" data-route="learn" data-i18n="navLearn"></button>
          <button class="nav-link" type="button" data-route="cases" data-i18n="navCases"></button>
          <button class="nav-link" type="button" data-route="library" data-i18n="navLibrary"></button>
          <button class="nav-link" type="button" data-route="progress" data-i18n="navProgress"></button>
        </nav>

        <div class="sidebar-bottom">
          <div class="privacy-note" id="privacy-note"></div>

          <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="false">
            <span class="motion-icon" aria-hidden="true">◌</span>
            <span data-i18n="reduceMotion"></span>
          </button>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation">
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div class="breadcrumbs" id="breadcrumbs" aria-live="polite"></div>

          <div class="topbar-actions">
            <div class="language-switcher" aria-label="Language selector">
              <button type="button" data-language="es">ES</button>
              <button type="button" data-language="en">EN</button>
              <button type="button" data-language="fr">FR</button>
            </div>

            <button class="profile-button" id="profile-button" type="button"></button>
          </div>
        </header>

        <main id="app-main" tabindex="-1"></main>
      </div>
    </div>

    <div class="modal-root" id="modal-root" aria-live="polite"></div>
    <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <div class="noscript">
        This learning hub needs JavaScript enabled.
      </div>
    </noscript>
  </body>
</html>
